name: cleanup-stale-branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete release branches
        shell: bash
        run: |
          git push origin --delete fix/windows-build-v0.1.1 || true
