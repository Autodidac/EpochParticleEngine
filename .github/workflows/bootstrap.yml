name: bootstrap-source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.source-bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Autodidac/EpochParticleEngine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import source tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' parts < <(
            find .source-bootstrap -maxdepth 1 -type f -name 'part[0-9][0-9]' -print0 | sort -zV
          )
          test "${#parts[@]}" -gt 0
          printf 'Importing %s source parts:\n' "${#parts[@]}"
          printf '  %s\n' "${parts[@]}"

          candidates="$RUNNER_TEMP/source-candidates"
          rm -rf "$candidates"
          mkdir -p "$candidates"

          set +e
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "$candidates/concat-decode.zip" 2>/dev/null

          : > "$candidates/decode-each.zip"
          for part in "${parts[@]}"; do
            tr -d '\r\n' < "$part" | base64 --decode >> "$candidates/decode-each.zip" 2>/dev/null || true
          done

          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode 2>/dev/null | \
            base64 --decode > "$candidates/concat-decode-twice.zip" 2>/dev/null

          : > "$candidates/decode-each-twice.zip"
          for part in "${parts[@]}"; do
            tr -d '\r\n' < "$part" | base64 --decode 2>/dev/null | \
              base64 --decode >> "$candidates/decode-each-twice.zip" 2>/dev/null || true
          done
          set -e

          source_zip=''
          for candidate in "$candidates"/*.zip; do
            printf '%s  %s\n' "$(sha256sum "$candidate" | cut -d' ' -f1)" "$(basename "$candidate")"
            if unzip -tq "$candidate" >/dev/null 2>&1; then
              source_zip="$candidate"
              break
            fi
          done
          test -n "$source_zip"
          echo "Validated archive reconstruction: $(basename "$source_zip")"

          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$source_zip" -d "$RUNNER_TEMP/source"
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.1.0"
          test -f "$source_root/CMakeLists.txt"
          (
            cd "$source_root"
            sha256sum -c "$GITHUB_WORKSPACE/.source-bootstrap/expected.sha256"
          )
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release EpochParticleEngine v0.1.0"
          git push origin HEAD:main
