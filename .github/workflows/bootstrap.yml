name: bootstrap-source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.source-bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Autodidac/EpochParticleEngine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import source tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' parts < <(
            find .source-bootstrap -maxdepth 1 -type f -name 'part*' -print0 | sort -zV
          )
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/source.zip"
          sha256sum "$RUNNER_TEMP/source.zip"
          unzip -tq "$RUNNER_TEMP/source.zip"
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.1.0"
          test -f "$source_root/CMakeLists.txt"
          (
            cd "$source_root"
            sha256sum -c "$GITHUB_WORKSPACE/.source-bootstrap/expected.sha256"
          )
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release EpochParticleEngine v0.1.0"
          git push origin HEAD:main
