name: cleanup-v0.1.3-branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v0.1.3-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete fix/vulkan-screen-space-v0.1.3 || true
          git push origin --delete release/v0.1.3 || true

      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-v0.1.3-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove v0.1.3 cleanup workflow"
          git push origin HEAD:main
