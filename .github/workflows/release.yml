name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  source:
    name: Source package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          [[ "$tag" == v* ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Validate tag and package
        shell: bash
        run: |
          set -euo pipefail
          header_version="$(sed -n 's/.*version_string = "\([^"]*\)".*/\1/p' include/epochengine/particle/version.hpp)"
          test "$RELEASE_VERSION" = "$header_version"
          ./scripts/package-source.sh "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ runner.temp }}/packages/*

  cpu-sdk:
    name: CPU SDK (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            generator: Ninja
          - name: macos-arm64
            os: macos-15
            generator: Ninja
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          [[ "$tag" == v* ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B out/release -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DEPOCH_PARTICLE_BUILD_VULKAN=OFF \
            -DEPOCH_PARTICLE_BUILD_EXAMPLES=ON \
            -DEPOCH_PARTICLE_BUILD_TESTS=ON \
            -DEPOCH_PARTICLE_WARNINGS_AS_ERRORS=ON
      - name: Build and test
        shell: bash
        run: |
          cmake --build out/release --parallel
          ctest --test-dir out/release --output-on-failure
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/EpochParticleEngine-v${RELEASE_VERSION}-${{ matrix.name }}"
          cmake --install out/release --prefix "$root"
          mkdir -p "$root/bin"
          cp out/release/EpochParticleHeadless "$root/bin/"
          cp out/release/EpochParticleReplay "$root/bin/"
          cp README.md CHANGELOG.md LICENSE "$root/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/EpochParticleEngine-v${RELEASE_VERSION}-${{ matrix.name }}.tar.gz" "$(basename "$root")"
          shasum -a 256 "$RUNNER_TEMP/EpochParticleEngine-v${RELEASE_VERSION}-${{ matrix.name }}.tar.gz" > "$RUNNER_TEMP/EpochParticleEngine-v${RELEASE_VERSION}-${{ matrix.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/*.tar.gz
            ${{ runner.temp }}/*.sha256

  windows-vulkan:
    name: Windows x64 Vulkan lab
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
              $tag = $env:GITHUB_REF_NAME
          } else {
              $tag = $env:GITHUB_REF_NAME -replace '^release/', ''
          }
          if (-not $tag.StartsWith('v')) { throw "Invalid release ref: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout pinned EpochPlatformEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochPlatformEngine
          ref: 4c5aee6cf419bd163759d71a7d3a3c1e35c66db8
          path: external/EpochPlatformEngine
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $baseline = 'd92484ed3c5020c6679d095ad3e5add907887b62'
          git init "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:RUNNER_TEMP/vcpkg" fetch --depth 1 origin $baseline
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B out/release `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DEPOCH_PLATFORM_SOURCE_DIR="$env:GITHUB_WORKSPACE/external/EpochPlatformEngine" `
            -DEPOCH_PARTICLE_FETCH_EPOCH_PLATFORM=OFF `
            -DEPOCH_PARTICLE_BUILD_VULKAN=ON `
            -DEPOCH_PARTICLE_BUILD_EXAMPLES=ON `
            -DEPOCH_PARTICLE_BUILD_TESTS=ON `
            -DEPOCH_PARTICLE_WARNINGS_AS_ERRORS=ON
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build out/release --config Release --parallel
          ctest --test-dir out/release -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "EpochParticleEngine-v$env:RELEASE_VERSION-windows-x64"
          cmake --install out/release --config Release --prefix $root
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'bin') | Out-Null
          Copy-Item out/release/Release/EpochParticleLab.exe (Join-Path $root 'bin')
          Copy-Item out/release/Release/EpochParticleHeadless.exe (Join-Path $root 'bin')
          Copy-Item out/release/Release/EpochParticleReplay.exe (Join-Path $root 'bin')
          Copy-Item README.md,CHANGELOG.md,LICENSE $root
          $archive = Join-Path $env:RUNNER_TEMP "EpochParticleEngine-v$env:RELEASE_VERSION-windows-x64.zip"
          Compress-Archive -Path $root -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content "$archive.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan
          path: |
            ${{ runner.temp }}/*.zip
            ${{ runner.temp }}/*.sha256

  publish:
    name: Publish GitHub release
    needs: [source, cpu-sdk, windows-vulkan]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          [[ "$tag" == v* ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EpochParticleEngine $RELEASE_TAG" \
              --generate-notes
          fi
