name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

concurrency:
  group: epoch-particle-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    name: Validate and package source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
            if [[ -f .release-trigger ]]; then
              target="$(git rev-parse "$GITHUB_SHA^")"
              git checkout --detach "$target"
            fi
          fi
          [[ "$tag" == v* ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET_SHA=$target" >> "$GITHUB_ENV"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          header_version="$(sed -n 's/.*version_string = "\([^"]*\)".*/\1/p' include/epochengine/particle/version.hpp)"
          cmake_version="$(sed -n '/project(EpochParticleEngine/{n;s/.*VERSION \([^ ]*\).*/\1/p;}' CMakeLists.txt)"
          test "$RELEASE_VERSION" = "$header_version"
          test "$RELEASE_VERSION" = "$cmake_version"

      - name: Configure CPU validation build
        shell: bash
        run: |
          cmake -S . -B out/release-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEPOCH_PARTICLE_BUILD_VULKAN=OFF \
            -DEPOCH_PARTICLE_BUILD_EXAMPLES=ON \
            -DEPOCH_PARTICLE_BUILD_TESTS=ON \
            -DEPOCH_PARTICLE_WARNINGS_AS_ERRORS=ON

      - name: Build and test
        shell: bash
        run: |
          cmake --build out/release-validation --parallel
          ctest --test-dir out/release-validation --output-on-failure
          ./out/release-validation/EpochParticleReplay
          ./out/release-validation/EpochParticleHeadless 240 12345 4

      - name: Package source
        shell: bash
        run: ./scripts/package-source.sh "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: validate-and-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
            if [[ -f .release-trigger ]]; then
              target="$(git rev-parse "$GITHUB_SHA^")"
            fi
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET_SHA=$target" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET_SHA" \
              --title "EpochParticleEngine $RELEASE_TAG" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET_SHA" \
              --title "EpochParticleEngine $RELEASE_TAG" \
              --generate-notes
          fi

  cleanup-trigger-branch:
    name: Remove release trigger branch
    if: always() && startsWith(github.ref, 'refs/heads/release/')
    needs: [validate-and-package, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete trigger branch
        shell: bash
        run: |
          git push origin --delete fix/windows-build-v0.1.1 || true
          git push origin --delete "$GITHUB_REF_NAME" || true
