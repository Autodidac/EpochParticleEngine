name: import-v0.2.0-source

on:
  push:
    branches:
      - feat/font-scenes-v0.2.0
    paths:
      - '.source-import/v0.2.0-tar/**'
      - '.github/workflows/import-v0.2.0.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.source-import/v0.2.0-tar/**'
      - '.github/workflows/import-v0.2.0.yml'

permissions:
  contents: write

concurrency:
  group: epoch-particle-v0.2.0-import
  cancel-in-progress: true

jobs:
  import:
    if: github.repository == 'Autodidac/EpochParticleEngine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/font-scenes-v0.2.0
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' parts < <(
            find .source-import/v0.2.0-tar -maxdepth 1 -type f -name 'part[0-9][0-9]' -print0 | sort -zV
          )
          test "${#parts[@]}" -eq 12

          clean="$RUNNER_TEMP/source.b64"
          : > "$clean"
          for part in "${parts[@]}"; do
            raw_bytes=$(wc -c < "$part")
            invalid_bytes=$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$part" | wc -c)
            printf '%s raw=%s invalid=%s\n' "$part" "$raw_bytes" "$invalid_bytes"
            LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$part" >> "$clean"
          done

          clean_bytes=$(wc -c < "$clean")
          printf 'clean total=%s modulo4=%s\n' "$clean_bytes" "$((clean_bytes % 4))"
          python3 - "$clean" <<'PY'
          import base64
          import binascii
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = path.read_bytes()
          print(f"python clean bytes={len(payload)} modulo4={len(payload) % 4}")
          print(f"padding count={payload.count(b'=')} first padding={payload.find(b'=')}")
          try:
              base64.b64decode(payload, validate=True)
          except binascii.Error as error:
              print(f"strict base64 error: {error}")
              raise
          PY

          base64 --decode "$clean" > "$RUNNER_TEMP/source.tar.xz"
          echo "260673a1a1e748c48453979b26424652de08567afe70b453a283c7341cf3ae22  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          tar -tJf "$RUNNER_TEMP/source.tar.xz" >/dev/null
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/source"
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.2.0"
          test -f "$source_root/CMakeLists.txt"
          grep -F 'VERSION 0.2.0' "$source_root/CMakeLists.txt"
          grep -F 'version_string = "0.2.0"' "$source_root/include/epochengine/particle/version.hpp"

      - name: Replace staging tree with source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.2.0"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release EpochParticleEngine v0.2.0"
          git push origin HEAD:feat/font-scenes-v0.2.0
