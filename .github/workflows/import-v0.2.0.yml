name: import-v0.2.0-source

on:
  push:
    branches:
      - feat/font-scenes-v0.2.0
    paths:
      - '.source-import/v0.2.0-tar/**'
      - '.github/workflows/import-v0.2.0.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.source-import/v0.2.0-tar/**'
      - '.github/workflows/import-v0.2.0.yml'

permissions:
  contents: write

concurrency:
  group: epoch-particle-v0.2.0-import
  cancel-in-progress: true

jobs:
  import:
    if: github.repository == 'Autodidac/EpochParticleEngine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/font-scenes-v0.2.0
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' parts < <(
            find .source-import/v0.2.0-tar -maxdepth 1 -type f -name 'part[0-9][0-9]' -print0 | sort -zV
          )
          test "${#parts[@]}" -eq 12

          clean="$RUNNER_TEMP/source.b64"
          prefix="$RUNNER_TEMP/source-prefix.b64"
          tail="$RUNNER_TEMP/source-tail.b64"
          : > "$prefix"

          for index in "${!parts[@]}"; do
            part="${parts[$index]}"
            raw_bytes=$(wc -c < "$part")
            invalid_bytes=$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$part" | wc -c)
            printf '%s raw=%s invalid=%s\n' "$part" "$raw_bytes" "$invalid_bytes"
            if (( index + 1 < ${#parts[@]} )); then
              LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$part" >> "$prefix"
            else
              LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$part" > "$tail"
            fi
          done

          python3 - "$prefix" "$tail" "$clean" <<'PY'
          import base64
          import binascii
          import hashlib
          import pathlib
          import string
          import sys

          prefix_path = pathlib.Path(sys.argv[1])
          tail_path = pathlib.Path(sys.argv[2])
          output_path = pathlib.Path(sys.argv[3])
          target = "260673a1a1e748c48453979b26424652de08567afe70b453a283c7341cf3ae22"

          prefix = prefix_path.read_bytes()
          tail = tail_path.read_bytes()
          payload = prefix + tail
          print(
              f"prefix={len(prefix)} tail={len(tail)} total={len(payload)} "
              f"modulo4={len(payload) % 4} padding={payload.count(b'=')}"
          )

          try:
              decoded = base64.b64decode(payload, validate=True)
          except binascii.Error:
              decoded = None

          if decoded is not None and hashlib.sha256(decoded).hexdigest() == target:
              output_path.write_bytes(payload)
              print("payload already matched expected SHA-256")
              raise SystemExit(0)

          if len(prefix) % 4 != 0:
              raise RuntimeError("prefix is not aligned to a base64 quartet")
          if len(payload) % 4 != 3:
              raise RuntimeError("payload is not missing exactly one base64 character")

          prefix_decoded = base64.b64decode(prefix, validate=True)
          prefix_hash = hashlib.sha256(prefix_decoded)
          alphabet = (string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/").encode()

          for position in range(len(tail) + 1):
              before = tail[:position]
              after = tail[position:]
              for value in alphabet:
                  candidate_tail = before + bytes((value,)) + after
                  try:
                      decoded_tail = base64.b64decode(candidate_tail, validate=True)
                  except binascii.Error:
                      continue
                  digest = prefix_hash.copy()
                  digest.update(decoded_tail)
                  if digest.hexdigest() == target:
                      repaired = prefix + candidate_tail
                      output_path.write_bytes(repaired)
                      print(
                          f"repaired missing character at tail offset {position}: "
                          f"{chr(value)!r}; total={len(repaired)}"
                      )
                      raise SystemExit(0)

          raise RuntimeError("unable to repair staged source payload")
          PY

          base64 --decode "$clean" > "$RUNNER_TEMP/source.tar.xz"
          echo "260673a1a1e748c48453979b26424652de08567afe70b453a283c7341cf3ae22  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          tar -tJf "$RUNNER_TEMP/source.tar.xz" >/dev/null
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/source"
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.2.0"
          test -f "$source_root/CMakeLists.txt"
          grep -F 'VERSION 0.2.0' "$source_root/CMakeLists.txt"
          grep -F 'version_string = "0.2.0"' "$source_root/include/epochengine/particle/version.hpp"

      - name: Replace staging tree with source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.2.0"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release EpochParticleEngine v0.2.0"
          git push origin HEAD:feat/font-scenes-v0.2.0
