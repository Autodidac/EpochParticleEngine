name: import-v0.2.0-source

on:
  push:
    branches:
      - feat/font-scenes-v0.2.0
    paths:
      - '.source-import/v0.2.0-tar/**'
      - '.source-import/repair_single_missing_base64.cpp'
      - '.github/workflows/import-v0.2.0.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.source-import/v0.2.0-tar/**'
      - '.source-import/repair_single_missing_base64.cpp'
      - '.github/workflows/import-v0.2.0.yml'

permissions:
  contents: write

concurrency:
  group: epoch-particle-v0.2.0-import
  cancel-in-progress: true

jobs:
  import:
    if: github.repository == 'Autodidac/EpochParticleEngine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/font-scenes-v0.2.0
          fetch-depth: 0

      - name: Recover and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' parts < <(
            find .source-import/v0.2.0-tar -maxdepth 1 -type f -name 'part[0-9][0-9]' -print0 | sort -zV
          )
          test "${#parts[@]}" -eq 12

          corrupt="$RUNNER_TEMP/source-corrupt.b64"
          repaired="$RUNNER_TEMP/source.b64"
          LC_ALL=C cat "${parts[@]}" | tr -cd 'A-Za-z0-9+/=' > "$corrupt"
          printf 'staged payload bytes=%s modulo4=%s\n' \
            "$(wc -c < "$corrupt")" \
            "$(( $(wc -c < "$corrupt") % 4 ))"

          g++ -std=c++23 -O3 -march=native -fopenmp \
            -Wno-deprecated-declarations \
            .source-import/repair_single_missing_base64.cpp \
            -lcrypto \
            -o "$RUNNER_TEMP/repair-single-missing-base64"

          OMP_NUM_THREADS="$(nproc)" \
            "$RUNNER_TEMP/repair-single-missing-base64" \
            "$corrupt" \
            260673a1a1e748c48453979b26424652de08567afe70b453a283c7341cf3ae22 \
            "$repaired"

          base64 --decode "$repaired" > "$RUNNER_TEMP/source.tar.xz"
          echo "260673a1a1e748c48453979b26424652de08567afe70b453a283c7341cf3ae22  $RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          tar -tJf "$RUNNER_TEMP/source.tar.xz" >/dev/null
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/source"
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.2.0"
          test -f "$source_root/CMakeLists.txt"
          grep -F 'VERSION 0.2.0' "$source_root/CMakeLists.txt"
          grep -F 'version_string = "0.2.0"' "$source_root/include/epochengine/particle/version.hpp"

      - name: Replace staging tree with clean source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/source/EpochParticleEngine-v0.2.0"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release EpochParticleEngine v0.2.0"
          git push origin HEAD:feat/font-scenes-v0.2.0
