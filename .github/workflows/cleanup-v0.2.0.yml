name: cleanup-v0.2.0

on:
  push:
    paths:
      - '.github/workflows/cleanup-v0.2.0.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove merged feature branch and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete feat/particle-studio-v0.2.0 || true
          if [[ -f .github/workflows/cleanup-v0.2.0.yml ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/cleanup-v0.2.0.yml
            git commit -m "chore: remove v0.2.0 cleanup workflow"
            git push origin HEAD:main
          fi
